<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
     <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

</head>

<body>
    <header>
        <div class="pesquisa">
            <h1>TODO List</h1>
            <input type="text" placeholder="pesquisar" />
        </div>
        <a class="btn" href="Login.html">Login</a>
    </header>
    <main>
        <div class="titulo">
            <h2>Tarefas</h2>
            <button onclick="abrirGaveta()"><box-icon type='solid' name='plus-circle'></box-icon>Nova Tarefa</button>
        </div>


        <div id="tarefas">
            <div class="tarefa">
            <h3>Titulo do card</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
            <div>
                <box-icon name="pencil"></box-icon>
                <box-icon name="trash" onclick="confirmarDeletar()"></box-icon>
            </div>
        </div>
        <div id="overflow" onclick="fecharGaveta()"></div>
        <div id="gaveta">
           <h3>Criar <box-icon name='x' onclick="fecharGaveta()"></box-icon></h3>
           <form id="form-criar">
                <label>Titulo</label>
                <input type="text" name="titulo" placeholder="Digite um titulo" required>
                <label>Descrição</label>
                <textarea name="descricao" required></textarea>
                <button type="submit">enviar</button>
           </form>
        </div>
    

    </main>
    <script src="index.js"></script>
</body>

</html>
